<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobilize the Home Front, 1941</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#10213a;--ink:#1b1f27;--panel:#e9edf0;--gold:#f0b323;--red:#a8281f;--green:#2f6b3f}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--ink);font-family:'Libre Baskerville',Georgia,serif;line-height:1.65}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1,h2,h3{font-family:Oswald,Impact,sans-serif;letter-spacing:.02em;margin:.2em 0}
h1{font-size:2.6rem;color:var(--gold);line-height:1.1}
.card{background:var(--panel);border-top:8px solid var(--gold);padding:22px 24px;margin-bottom:18px}
.top{color:#fff;display:flex;justify-content:space-between;font-family:Oswald,sans-serif;margin-bottom:10px}
.bar{height:8px;background:#344a6b;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--gold)}
.ph{width:100%;aspect-ratio:16/9;object-fit:cover;background:#2a3c58;display:block;margin-bottom:6px}
.ph.fb{color:#cdd6e3;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:.9rem}
.cap{font-size:.78rem;color:#555;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:2px solid #aab4bf;padding:12px 14px;margin:10px 0;cursor:pointer}
.opt:hover{border-color:var(--navy)}.opt.sel{border-color:var(--navy);background:#dbe6f5;box-shadow:inset 6px 0 0 var(--navy)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font-family:Oswald,sans-serif;font-size:1.15rem;background:var(--red);color:#fff;border:0;padding:12px 28px;cursor:pointer;margin-top:10px}
.btn:disabled{background:#999;cursor:not-allowed}
.pts{font-family:Oswald,sans-serif;font-size:2.4rem}.good{color:var(--green)}.bad{color:var(--red)}
.best{border-left:6px solid var(--green);background:#fff;padding:10px 14px;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px;border-bottom:1px solid #b8c0c9;text-align:left}
.def{background:#fff;border-left:6px solid var(--red);padding:10px 14px;margin:14px 0}
</style></head><body><main id="app"></main>
<script>
/* ===== EDIT CONTENT HERE. Option points: 5 best, 3 partial, -3 weak, -5 harmful ===== */
const C=[
{t:"Aircraft Production",s:"The Arsenal of Democracy",img:"images/ch1.jpg",cap:"Suggested photo: B-24 bombers on the Willow Run assembly line (Library of Congress / National Archives)",
b:"The Army and Navy want 60,000 aircraft in 1942 and 125,000 in 1943. In 1939 the nation built about 2,100 military planes. Aircraft makers have limited factory space and few workers. Automakers, however, build 3.6 million cars a year, own huge assembly plants, and employ skilled machinists. Aluminum is in short supply.",
o:[["Convert automobile plants to build aircraft and parts, use assembly-line methods, and give aluminum a war priority.",5],["Expand the existing aircraft companies' factories and hire more workers, leaving carmakers alone.",3],["Place orders and let each company set its own pace based on profit.",-3],["Build planes in small craft shops to maximize quality, even if output is low.",-5]],
d:"Auto production for civilians stopped in early 1942. Ford's Willow Run plant eventually built a B-24 bomber about every hour. U.S. factories produced roughly 300,000 aircraft during the war."},
{t:"The Steel Crisis",s:"Allocating critical resources",img:"images/ch2.jpg",cap:"Suggested photo: steel mill workers or a scrap metal drive, 1942",
b:"U.S. mills can produce about 88 million tons of steel a year. Requests from the Army, Navy, Maritime Commission, railroads, and civilian industries total about 110 million tons. Tanks, ships, and guns cannot be built if steel goes to the wrong places.",
o:[["Set up a priority system that gives war production first claim on steel, bans nonessential civilian uses, and runs scrap drives.",5],["Run scrap drives and expand the mills, and trust industries to share fairly.",3],["Fill orders in the order received, starting with the largest customers.",-3],["Give every industry, military and civilian, an equal share.",-5]],
d:"The War Production Board used priority ratings, then the Controlled Materials Plan (1943) to divide steel, copper, and aluminum. Civilian goods like refrigerators were largely halted. Scrap drives collected millions of tons."},
{t:"Building the Fleet",s:"Winning the Battle of Production",img:"images/ch3.jpg",cap:"Suggested photo: Liberty ship launching at a Kaiser shipyard",
b:"German U-boats sank hundreds of Allied cargo ships in 1942, about 6 million tons in total. Traditional shipyards need nearly a year to finish one cargo ship using skilled riveters. Millions of tons of supplies must cross the Atlantic. Skilled shipbuilders are scarce.",
o:[["Mass-produce one standard design (the Liberty ship), weld prefabricated sections, build new yards, and train workers on single tasks.",5],["Add workers to existing yards and keep the traditional riveted methods.",3],["Custom-design each ship for the best performance on its route.",-3],["Pause new construction until the U-boat threat is reduced.",-5]],
d:"Liberty ships were welded from prefabricated parts. Average build time dropped to about 42 days; one was finished in under five. About 2,700 were built, and by 1943 launches exceeded sinkings."},
{t:"The Labor Shortage",s:"Keeping factories running",img:"images/ch4.jpg",cap:"Suggested photo: women riveters or welders; Black workers in a defense plant",
b:"About 16 million Americans will serve in the military. Factories face a shortage of over a million workers. Many defense plants refuse to hire Black workers, and many refuse women. In 1941 civil rights leader A. Philip Randolph threatened a march on Washington over discrimination.",
o:[["Recruit women, train new workers quickly, and enforce a ban on discrimination in defense hiring.",5],["Recruit and train women but leave hiring discrimination against minorities alone.",3],["Extend existing workers' hours to 80 a week to avoid hiring new people.",-3],["Hire only men and wait for veterans to return.",-5]],
d:"Women in the workforce grew from about 12 million to over 18 million. Executive Order 8802 created the Fair Employment Practices Committee, though enforcement was uneven. Black, Mexican American, and other workers entered war industry in large numbers."},
{t:"The Fuel Crisis",s:"Getting fuel where it matters most",img:"images/ch5.jpg",cap:"Suggested photo: gasoline ration stickers or a Victory Speed poster",
b:"The East Coast gets nearly all its oil by tanker, and U-boats are sinking dozens of tankers off U.S. shores. Rubber is short, so tires cannot be replaced. Military vehicles, aircraft, and ships need huge quantities of fuel. Most workers drive to their jobs.",
o:[["Ration gasoline, set a 35 mph speed limit, build oil pipelines from Texas, and give military and war-plant needs priority.",5],["Ration gasoline nationwide but do nothing about oil transport.",3],["Ban all civilian driving.",-3],["Let prices rise freely and let the market decide who gets gas.",-5]],
d:"Rationing began on the East Coast in May 1942 and went nationwide in December. Workers in essential jobs received more stickers. The Big Inch and Little Big Inch pipelines carried oil from Texas to the Northeast."},
{t:"The Transportation Bottleneck",s:"Moving the war machine",img:"images/ch6.jpg",cap:"Suggested photo: troop train, 1942, or a crowded railroad station",
b:"Railroads must carry about 90% of Army freight and nearly all troop movements. Tires and gasoline are scarce, so trucking is limited. Freight cars sit half-empty while war plants wait on parts, and trains are crowded with ordinary travelers.",
o:[["Coordinate all shipping, give war freight priority, load cars fully, and discourage nonessential civilian travel.",5],["Buy more locomotives and freight cars but set no shipping priorities.",3],["Shift most freight to trucks.",-3],["Let railroads schedule shipments by profitability.",-5]],
d:"The Office of Defense Transportation controlled schedules and loads. Posters asked 'Is this trip necessary?' Railroads moved record freight and nearly 30 million troops."},
{t:"Feeding America",s:"Victory Gardens and food supplies",img:"images/ch7.jpg",cap:"Suggested photo: Victory Garden poster or ration book",
b:"The military and Allies need huge food shipments. Many farm workers have left for the service. Sugar, meat, butter, and canned goods are growing scarce, and prices are rising. Americans want to help but also fear hoarding.",
o:[["Encourage Victory Gardens, ration scarce foods with a points system, control prices, and support farm labor.",5],["Encourage Victory Gardens and voluntary conservation only.",3],["Send all surplus food to the military and Allies with no civilian protection.",-3],["End price controls so farmers produce more.",-5]],
d:"About 20 million Victory Gardens supplied roughly 40% of fresh vegetables by 1944. The Office of Price Administration ran rationing and price controls to fight hoarding and inflation."},
{t:"Financing the War",s:"War Bonds and public participation",img:"images/ch8.jpg",cap:"Suggested photo: War Bond poster or children buying War Stamps",
b:"The war will cost roughly $300 billion. Only about 4 million Americans pay income tax. Wages are rising, but there are few consumer goods to buy, which threatens inflation. Officials want citizens to feel invested in the war.",
o:[["Hold bond drives with stamps for children, bring millions into the income tax, and use withholding to collect it.",5],["Sell bonds with posters and celebrity appeals but keep taxes unchanged.",3],["Print more money.",-3],["Borrow only from banks and keep the public out of it.",-5]],
d:"Eight war loan drives raised about $185 billion. Income taxpayers grew from about 4 million to roughly 40 million, and payroll withholding began in 1943. Savings helped slow inflation."},
{t:"Propaganda and Public Morale",s:"Keeping the nation united",img:"images/ch9.jpg",cap:"Suggested photo: 'Loose Lips Sink Ships' or other OWI poster",
b:"Americans must support enlistment and production, and enemy spies want information about ship sailings. Rumors and rival newspapers are spreading confusion. Officials fear both leaks and a loss of public trust.",
o:[["Create an agency to share truthful information, ask the press to withhold only genuine military secrets, and run clear posters and films.",5],["Run posters and radio ads for production and enlistment without addressing security.",3],["Censor all bad news, including casualties and defeats.",-3],["Spread exaggerated enemy atrocity stories to boost anger.",-5]],
d:"The Office of War Information (1942) coordinated messaging; the Office of Censorship asked for voluntary press restraint on troop movements. 'Loose lips sink ships' became famous."},
{t:"Civil Liberties During Wartime",s:"Executive Order 9066",img:"images/ch10.jpg",cap:"Suggested photo: Japanese American families at a relocation notice (Dorothea Lange / National Archives)",
b:"After Pearl Harbor, fear and prejudice grow on the West Coast. About 120,000 people of Japanese ancestry live there; about two-thirds are U.S. citizens. The FBI has already arrested suspected spies. No Japanese American has been shown to commit sabotage. Germans and Italians face no mass removal.",
o:[["Investigate individuals on evidence, guard key sites, and protect constitutional rights and the public from mob violence.",5],["Guard key sites and investigate suspects, but stay silent on the prejudice behind the calls for removal.",3],["Remove only non-citizens of Japanese ancestry.",-3],["Remove everyone of Japanese ancestry from the West Coast.",-5]],
d:"What America actually did: Executive Order 9066 (Feb. 1942) led to the forced removal and incarceration of about 120,000 people. The Supreme Court upheld it in Korematsu (1944). In 1988 Congress apologized and paid $20,000 to survivors. Note: the 5-point answer is the one historians judge correct now, not what officials chose."}
];
const MAX=C.length*5,PASS=.8;
let i=-1,score=0,log=[],pick=null,order=[],locked=false;
const $=document.getElementById('app');
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function img(c){return `<img class="ph" src="${c.img}" alt="${c.cap}" onerror="this.outerHTML='<div class=&quot;ph fb&quot;>${c.cap.replace(/'/g,'')}</div>'"><p class="cap">${c.cap}</p>`}
function top(){return `<div class="top"><span>Challenge ${i+1} of ${C.length}</span><span>Score: ${score}</span></div><div class="bar"><i style="width:${(i/C.length)*100}%"></i></div>`}
function intro(){$.innerHTML=`<div class="card"><h2>The White House, December 8, 1941</h2>
<p><b>My fellow Americans:</b></p>
<p>Yesterday, December 7, Japanese forces bombed Pearl Harbor. Our nation is now at war with Japan, and Germany and Italy have declared war on us. The fight will be won on battlefields, and it will also be won in our factories, farms, railroads, and homes.</p>
<div class="def"><b>The home front</b> is everything civilians do at home to support a war: building weapons, growing food, saving fuel, buying bonds, and working in the factories, while the military fights overseas.</div>
<p>Over the next ten challenges you will allocate resources and make policy decisions. Read each briefing and use its numbers. Some choices sound sensible and are not. Our goal is a score of <b>80% or higher (${PASS*MAX} of ${MAX} points)</b>.</p>
<p><i>- Franklin D. Roosevelt (classroom dramatization, not an actual quotation)</i></p>
<button class="btn" onclick="next()">Begin mobilization</button></div>`}
function next(){i++;if(i>=C.length)return end();const c=C[i];pick=null;locked=false;order=shuffle(c.o);
$.innerHTML=top()+`<div class="card"><h2>${c.t}</h2><h3>${c.s}</h3>${img(c)}<p>${c.b}</p><h3>Your decision</h3><div id="opts"></div><button class="btn" id="lock" disabled onclick="lock()">Lock in answer</button></div>`;drawOpts();window.scrollTo(0,0)}
function drawOpts(){document.getElementById('opts').innerHTML=order.map((o,k)=>`<button class="opt ${pick===k?'sel':''}" onclick="sel(${k})">${'ABCD'[k]}. ${o[0]}</button>`).join('')}
function sel(k){pick=k;drawOpts();document.getElementById('lock').disabled=false}
function lock(){const c=C[i],o=order[pick],p=o[1],best=c.o.find(x=>x[1]==5);score+=p;log.push(p);
$.innerHTML=top()+`<div class="card"><h2>Discovery: ${c.t}</h2><div class="pts ${p>0?'good':'bad'}">${p>0?'+':''}${p} points</div>
<p><b>You chose:</b> ${o[0]}</p>${p<5?`<div class="best"><b>Best answer (+5):</b> ${best[0]}</div>`:''}
<p><b>What America did:</b> ${c.d}</p><button class="btn" onclick="next()">${i==C.length-1?'See final results':'Next challenge'}</button></div>`;window.scrollTo(0,0)}
function end(){const pct=Math.max(0,Math.round(score/MAX*100)),win=score/MAX>=PASS;
$.innerHTML=`<div class="card"><h1 style="color:var(--navy)">${win?'Victory on the home front':'The home front falls short'}</h1><div class="pts ${win?'good':'bad'}">${score} of ${MAX} points (${pct}%)</div>
<p>${win?'You met the 80% goal. Your decisions kept American production moving.':'You did not reach 80%. Review the discovery notes and try again with the data in each briefing.'}</p>
<table><tr><th>Challenge</th><th>Points</th></tr>${C.map((c,k)=>`<tr><td>${k+1}. ${c.t}</td><td>${log[k]>0?'+':''}${log[k]}</td></tr>`).join('')}</table>
<button class="btn" onclick="i=-1;score=0;log=[];intro()">Play again</button></div>`}
intro();
</script></body></html>
